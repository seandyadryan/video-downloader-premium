name: Android verification and signed release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_download:
        description: 'Run the optional public sample-video download integration test'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5, Node 24
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4, Node 24
        with:
          log-accepted-android-sdk-licenses: false
      - name: Prepare SDK and Gradle
        run: |
          chmod +x gradlew
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Check translations, unit tests, lint and debug APK
        run: |
          pwsh -File tools/Check-Resources.ps1
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, Node 24
        if: always()
        with:
          name: debug-apk-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
          retention-days: 14
          if-no-files-found: error

  device-tests:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4, Node 24
        with:
          log-accepted-android-sdk-licenses: false
      - name: Enable KVM and create emulator
        run: |
          sudo chmod 666 /dev/kvm
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'system-images;android-35;google_apis;x86_64'
          echo no | avdmanager create avd --force --name premium-ci --package 'system-images;android-35;google_apis;x86_64' --device pixel_6
          "$ANDROID_HOME/emulator/emulator" -avd premium-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell input keyevent 82
          adb shell settings put system screen_off_timeout 1800000
          adb shell svc power stayon true
          adb shell input keyevent 224
          adb shell wm dismiss-keyguard
      - name: Run offline device tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon connectedDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=com.deploydulupulangnanti.videodownloaderpremium.AppSmokeTest#navigationGuideAndRealDnsStatus,com.deploydulupulangnanti.videodownloaderpremium.AppSmokeTest#languagePacksAreCompleteAndOffline,com.deploydulupulangnanti.videodownloaderpremium.AppSmokeTest#browserTabsHistoryAndRecreation'
      - name: Capture English phone and desktop store screenshots
        run: |
          adb shell wm size 1080x1920
          adb shell wm density 420
          adb shell cmd statusbar collapse
          ./gradlew --no-daemon connectedDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=com.deploydulupulangnanti.videodownloaderpremium.AppSmokeTest#storeScreenshots' '-Pandroid.testInstrumentationRunnerArguments.capturePrefix=phone'
          adb shell wm size 1920x1080
          adb shell wm density 240
          ./gradlew --no-daemon connectedDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=com.deploydulupulangnanti.videodownloaderpremium.AppSmokeTest#storeScreenshots' '-Pandroid.testInstrumentationRunnerArguments.capturePrefix=desktop'
      - name: Run live video download integration test
        if: github.event_name == 'workflow_dispatch' && inputs.run_live_download
        run: ./gradlew --no-daemon connectedDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=com.deploydulupulangnanti.videodownloaderpremium.AppSmokeTest#actualDownloadManagerTransfer'
      - name: Collect device screenshots
        if: always()
        run: adb pull '/sdcard/Pictures/VideoDownloaderPremium-QA' app/build/reports/device-screenshots
      - name: Stop emulator
        if: always()
        run: adb emu kill || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/device-screenshots/
          retention-days: 14

  release:
    needs: [verify, device-tests]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4, Node 24
        with:
          log-accepted-android-sdk-licenses: false
      - name: Build signed APK and Play Store bundle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Configure ANDROID_KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?Configure KEYSTORE_PASSWORD}"
          : "${KEY_PASSWORD:?Configure KEY_PASSWORD}"
          : "${KEY_ALIAS:?Configure KEY_ALIAS}"
          export KEYSTORE_PATH="$RUNNER_TEMP/premium-release.jks"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod +x gradlew
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          ./gradlew --no-daemon assembleRelease bundleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/bundle-signature.log" 2>&1
          sha256sum app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab > app/build/outputs/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: premium-signed-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
